<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cal Tracker">
<title>Cal Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#777; --accent:#2f7d4f; --line:#e3e3e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --fg:#eee; --muted:#999; --accent:#5cc58a; --line:#33373b; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; max-width:720px; margin:0 auto;
    padding-top:env(safe-area-inset-top); }
  main { flex:1; overflow-y:auto; padding:16px; }
  nav { display:flex; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; padding:14px 4px; background:none; border:0; color:var(--muted); font-size:14px; }
  nav button.active { color:var(--accent); font-weight:600; }
  input, button.primary { font-size:16px; padding:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); width:100%; margin-bottom:10px; }
  button.primary { background:var(--accent); color:#fff; border:0; }
  .hidden { display:none !important; }
  #login { padding:32px 16px; max-width:360px; margin:0 auto; }
  .muted { color:var(--muted); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <h2>Cal Tracker</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="primary" id="loginBtn">Sign in</button>
  <p id="loginMsg" class="muted"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <main>
    <section id="tab-log"><h2>Log Food</h2><p class="muted">Placeholder: entry form goes here.</p></section>
    <section id="tab-foods" class="hidden"><h2>Food Reference</h2><p id="foodCount" class="muted">Loading…</p></section>
    <section id="tab-calendar" class="hidden"><h2>Calendar</h2><p class="muted">Placeholder: calendar goes here.</p></section>
    <section id="tab-stats" class="hidden"><h2>Stats</h2><p class="muted">Placeholder: stats go here.</p>
      <button class="primary" id="logoutBtn" style="margin-top:24px">Sign out</button></section>
  </main>
  <nav>
    <button data-tab="log" class="active">Log</button>
    <button data-tab="foods">Foods</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="stats">Stats</button>
  </nav>
</div>

<script>
// ====== PASTE YOUR SUPABASE VALUES HERE ======
const SUPABASE_URL = "https://bzbpgzgfkbazixxtahkl.supabase.co/";
const SUPABASE_KEY = "sb_publishable_agbKH-ZpEBAYw5C9WX0uCg_SWGTLHoA";
// =============================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function showTab(name) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  $("tab-" + name).classList.remove("hidden");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

async function loadFoodCount() {
  const { count, error } = await db.from("foods").select("*", { count: "exact", head: true });
  $("foodCount").textContent = error ? "Error: " + error.message : `Connected. ${count} foods in your reference table.`;
}

function render(session) {
  $("login").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  if (session) loadFoodCount();
}

$("loginBtn").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  $("loginMsg").textContent = error ? error.message : "";
};
$("logoutBtn").onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_e, session) => render(session));
db.auth.getSession().then(({ data }) => render(data.session));
</script>
</body>
</html>
