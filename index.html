<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cal Tracker">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cal Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#777; --accent:#2f7d4f; --line:#e3e3e3; --card:#f5f6f7; --danger:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --fg:#eee; --muted:#999; --accent:#5cc58a; --line:#33373b; --card:#202326; --danger:#e57368; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; max-width:720px; margin:0 auto;
    padding-top:env(safe-area-inset-top); }
  main { flex:1; overflow-y:auto; padding:16px; }
  nav { display:flex; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; padding:14px 4px; background:none; border:0; color:var(--muted); font-size:14px; }
  nav button.active { color:var(--accent); font-weight:600; }
  input, button.primary { font-size:16px; padding:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); width:100%; margin-bottom:10px; }
  button.primary { background:var(--accent); color:#fff; border:0; }
  .hidden { display:none !important; }
  #login { padding:32px 16px; max-width:360px; margin:0 auto; }
  .muted { color:var(--muted); }

  /* Log tab */
  .datebar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .datebar input { margin:0; flex:1; }
  .datebar button { font-size:18px; padding:10px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); }
  .datebar button.today { font-size:14px; }
  .addrow { display:flex; gap:8px; margin-bottom:4px; }
  .addrow .qty { width:76px; flex:none; margin:0; text-align:center; }
  .foodwrap { position:relative; flex:1; }
  .foodwrap input { margin:0; }
  #suggest { position:absolute; left:0; right:0; top:100%; z-index:20; margin:4px 0 0; padding:0; list-style:none;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; max-height:280px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.18); }
  #suggest li { display:flex; justify-content:space-between; gap:12px; padding:12px; border-bottom:1px solid var(--line); }
  #suggest li:last-child { border-bottom:0; }
  #suggest li.active { background:var(--card); }
  #suggest .cal { color:var(--muted); white-space:nowrap; }
  #logMsg2 { min-height:20px; font-size:14px; color:var(--danger); margin:6px 0; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th { text-align:left; font-size:12px; color:var(--muted); font-weight:500; padding:6px 4px; border-bottom:1px solid var(--line); }
  td { padding:10px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th.num, td.num { text-align:right; white-space:nowrap; }
  td.del { width:36px; text-align:right; }
  td.del button { background:none; border:0; color:var(--muted); font-size:20px; padding:4px 8px; }
  tr.total td { font-weight:700; border-bottom:0; }

  /* Foods tab */
  .foodsbar { display:flex; gap:8px; margin-bottom:10px; }
  .foodsbar input { margin:0; flex:1; }
  .foodsbar button { width:auto; margin:0; padding:12px 16px; white-space:nowrap; }
  #foodForm { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  #foodForm h3 { margin:0 0 10px; font-size:16px; }
  #foodForm .two { display:flex; gap:8px; }
  #foodForm .two input { min-width:0; }
  #foodForm .btns { display:flex; gap:8px; }
  #foodForm .btns button { margin:0; }
  button.secondary { font-size:16px; padding:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); width:100%; }
  #formMsg { min-height:18px; font-size:14px; color:var(--danger); margin:0 0 8px; }
  .tablewrap { max-height:58vh; overflow-y:auto; border:1px solid var(--line); border-radius:8px; }
  .tablewrap table { margin:0; }
  .tablewrap th { position:sticky; top:0; background:var(--card); z-index:1; padding:8px 6px; }
  .tablewrap td { padding:10px 6px; }
  td.act { white-space:nowrap; text-align:right; width:84px; }
  td.act button { background:none; border:0; color:var(--muted); font-size:18px; padding:4px 8px; }
  .na { color:var(--muted); }

  /* Calendar tab */
  .calbar { display:flex; justify-content:center; margin-bottom:10px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:var(--bg); color:var(--muted); border:0; padding:10px 24px; font-size:15px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .calnav { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calnav button { font-size:20px; padding:6px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  #calTitle { font-size:18px; font-weight:600; }
  .calwrap { display:flex; gap:8px; align-items:stretch; }
  #calMain { flex:1; min-width:0; }
  .monthgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .dow { text-align:center; font-size:12px; color:var(--muted); padding:4px 0; }
  .day { min-height:56px; border-radius:6px; background:var(--card); padding:3px 4px; display:flex; flex-direction:column;
    justify-content:space-between; color:#111; border:2px solid transparent; cursor:pointer; overflow:hidden; }
  .day.blank { background:none; cursor:default; }
  .day.uncolored { color:var(--muted); }
  .day.sel { border-color:var(--fg); }
  .day .n { font-size:11px; font-weight:600; }
  .day.today .n { text-decoration:underline; }
  .day .c { font-size:11px; text-align:right; }
  .yeargrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mtile { border-radius:10px; padding:10px 8px; min-height:96px; background:var(--card); color:#111; cursor:pointer;
    display:flex; flex-direction:column; justify-content:space-between; }
  .mtile.uncolored { color:var(--muted); }
  .mtile .mn { font-weight:600; }
  .mtile .av { font-size:18px; font-weight:700; }
  .mtile .dc { font-size:11px; opacity:.75; }
  #scale { position:relative; width:52px; flex:none; }
  #scaleBar { position:absolute; left:0; top:8px; bottom:8px; width:14px; border-radius:7px; }
  .slabel { position:absolute; left:20px; font-size:11px; color:var(--muted); transform:translateY(-50%); white-space:nowrap; }
  #calNote { font-size:12px; margin:10px 0 0; }
  #dayDetail { margin-top:14px; }
  #dayDetail h3 { margin:0 0 4px; font-size:16px; }

  /* Stats tab */
  :root { --dot:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --dot:#60a5fa; } }
  .wform { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .wform input { margin:0; min-width:0; }
  .wform button { grid-column:1 / 3; margin:0; }
  .rangebar { display:flex; gap:8px; margin-top:16px; }
  .rangebar label { flex:1; font-size:12px; color:var(--muted); }
  .rangebar input { margin:4px 0 0; }
  .quick { display:flex; gap:6px; margin:8px 0; }
  .quick button { flex:1; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:13px; }
  #chartBox svg { width:100%; height:auto; display:block; touch-action:pan-y; }
  #readout { min-height:20px; font-size:13px; color:var(--muted); margin:6px 0 2px; }
  .legend { font-size:12px; color:var(--muted); margin:2px 0 8px; }
  .legend .l1 { color:var(--accent); font-weight:700; }
  .legend .l2 { color:var(--dot); }
  #tab-stats h3 { font-size:16px; margin:18px 0 4px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <h2>Cal Tracker</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="primary" id="loginBtn">Sign in</button>
  <p id="loginMsg" class="muted"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <main>
    <section id="tab-log">
      <div class="datebar">
        <button id="prevDay" aria-label="Previous day">‹</button>
        <input id="logDate" type="date">
        <button id="nextDay" aria-label="Next day">›</button>
        <button id="todayBtn" class="today">Today</button>
      </div>

      <div class="addrow">
        <input id="qty" class="qty" type="number" inputmode="decimal" step="any" min="0" value="1" aria-label="Quantity">
        <div class="foodwrap">
          <input id="foodInput" type="text" placeholder="Start typing a food…" autocomplete="off" autocapitalize="off">
          <ul id="suggest" class="hidden"></ul>
        </div>
      </div>
      <div id="logMsg2"></div>
      <button class="primary" id="addBtn">Add</button>

      <table>
        <thead><tr><th>Food</th><th class="num">Qty</th><th class="num">Cal</th><th></th></tr></thead>
        <tbody id="entryBody"></tbody>
      </table>
      <p id="emptyMsg" class="muted hidden">Nothing logged for this day yet.</p>

      <h3 style="font-size:16px;margin:22px 0 8px">Exercise</h3>
      <div class="addrow">
        <div class="foodwrap"><input id="exLabel" type="text" placeholder="Label (e.g. Run)" autocomplete="off"></div>
        <input id="exCal" class="qty" style="width:110px" type="number" inputmode="decimal" step="any" min="0" placeholder="Cal burned">
      </div>
      <div id="exMsg" style="min-height:20px;font-size:14px;color:var(--danger);margin:6px 0"></div>
      <button class="primary" id="addExBtn">Add exercise</button>
      <table><tbody id="exBody"></tbody></table>
    </section>

    <section id="tab-foods" class="hidden">
      <div class="foodsbar">
        <input id="foodSearch" type="search" placeholder="Search foods…" autocomplete="off">
        <button class="primary" id="addFoodBtn">+ Add food</button>
      </div>

      <div id="foodForm" class="hidden">
        <h3 id="formTitle">Add food</h3>
        <input id="fName" type="text" placeholder="Name" autocomplete="off">
        <div class="two">
          <input id="fCal" type="number" inputmode="decimal" step="any" min="0" placeholder="Calories">
          <input id="fProt" type="number" inputmode="decimal" step="any" min="0" placeholder="Protein (g)">
        </div>
        <div id="formMsg"></div>
        <div class="btns">
          <button class="primary" id="saveFoodBtn">Save</button>
          <button class="secondary" id="cancelFoodBtn">Cancel</button>
        </div>
      </div>

      <p id="foodCount" class="muted">Loading…</p>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Food</th><th class="num">Cal</th><th class="num">Protein</th><th></th></tr></thead>
          <tbody id="foodsBody"></tbody>
        </table>
      </div>
    </section>
    <section id="tab-calendar" class="hidden">
      <div class="calbar"><div class="seg">
        <button id="viewYear">Year</button><button id="viewMonth">Month</button>
      </div></div>
      <div class="calnav">
        <button id="calPrev" aria-label="Previous">‹</button>
        <div id="calTitle"></div>
        <button id="calNext" aria-label="Next">›</button>
      </div>
      <div class="calwrap">
        <div id="calMain"></div>
        <div id="scale"><div id="scaleBar"></div></div>
      </div>
      <p id="calNote" class="muted"></p>
      <div id="dayDetail" class="hidden"></div>
    </section>
    <section id="tab-stats" class="hidden"><h2>Estimated weight</h2>
      <div class="wform">
        <input id="wDate" type="date" aria-label="Weigh-in date">
        <input id="wVal" type="number" inputmode="decimal" step="any" min="0" placeholder="Weight (lb)">
        <button class="primary" id="wAddBtn">Save weigh-in</button>
      </div>
      <div id="wMsg" style="min-height:20px;font-size:14px;color:var(--danger);margin:6px 0"></div>

      <div class="rangebar">
        <label>From<input id="rFrom" type="date"></label>
        <label>To<input id="rTo" type="date"></label>
      </div>
      <div class="quick" id="quick">
        <button data-r="7">1W</button><button data-r="30">1M</button><button data-r="90">3M</button><button data-r="all">All</button>
      </div>

      <div id="readout"></div>
      <div id="chartBox"></div>
      <div class="legend"><span class="l1">━</span> estimate &nbsp; <span class="l2">●</span> weigh-in</div>
      <p id="statNote" class="muted" style="font-size:13px">Loading…</p>

      <h3>Weigh-ins</h3>
      <table><tbody id="wBody"></tbody></table>
      <button class="primary" id="logoutBtn" style="margin-top:24px">Sign out</button></section>
  </main>
  <nav>
    <button data-tab="log" class="active">Log</button>
    <button data-tab="foods">Foods</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="stats">Stats</button>
  </nav>
</div>

<script>
// ====== PASTE YOUR SUPABASE VALUES HERE ======
const SUPABASE_URL = "https://bzbpgzgfkbazixxtahkl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6YnBnemdma2Jheml4eHRhaGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDYwODUsImV4cCI6MjEwODc4MjA4NX0.UcLJAM9bRh0Z_MKIjvKgVnNpL1aKezcSfrfFYRg2ZKY";
// =============================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let foods = [];            // [{name, calories}]
let selectedFood = null;   // food picked from the dropdown
let matches = [];
let activeIdx = 0;

/* ---------- helpers ---------- */
const fmt = n => String(Number(Number(n).toFixed(1)));
function todayStr() { return new Date().toLocaleDateString("en-CA"); } // local YYYY-MM-DD
function shiftDate(str, days) {
  const d = new Date(str + "T12:00:00"); d.setDate(d.getDate() + days);
  return d.toLocaleDateString("en-CA");
}

/* ---------- tabs ---------- */
function showTab(name) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  $("tab-" + name).classList.remove("hidden");
  if (name === "calendar") loadCalendar();
  if (name === "stats") loadStats();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ---------- foods ---------- */
let editingId = null;

async function loadFoods() {
  const { data, error } = await db.from("foods").select("id,name,calories,protein").order("name").limit(2000);
  if (error) { $("foodCount").textContent = "Error: " + error.message; return; }
  foods = data;
  renderFoods();
}

function renderFoods() {
  const q = $("foodSearch").value.trim().toLowerCase();
  const list = foods.filter(f => f.name.toLowerCase().includes(q));
  $("foodCount").textContent = q ? `${list.length} of ${foods.length} foods` : `${foods.length} foods`;
  const body = $("foodsBody");
  body.innerHTML = "";
  list.forEach(f => {
    const tr = document.createElement("tr");
    const tdN = document.createElement("td"); tdN.textContent = f.name;
    const tdC = document.createElement("td"); tdC.className = "num"; tdC.textContent = fmt(f.calories);
    const tdP = document.createElement("td"); tdP.className = "num";
    if (f.protein === null) { tdP.textContent = "N/A"; tdP.classList.add("na"); } else tdP.textContent = fmt(f.protein) + " g";
    const tdA = document.createElement("td"); tdA.className = "act";
    const ed = document.createElement("button"); ed.textContent = "✎"; ed.setAttribute("aria-label", "Edit");
    ed.onclick = () => openFoodForm(f);
    const del = document.createElement("button"); del.textContent = "×"; del.setAttribute("aria-label", "Delete");
    del.onclick = async () => {
      if (!confirm(`Delete "${f.name}" from your foods?\n(Past days that used it are not affected.)`)) return;
      const { error } = await db.from("foods").delete().eq("id", f.id);
      if (error) alert("Error: " + error.message); else loadFoods();
    };
    tdA.append(ed, del);
    tr.append(tdN, tdC, tdP, tdA);
    body.appendChild(tr);
  });
}

function openFoodForm(f) {
  editingId = f ? f.id : null;
  $("formTitle").textContent = f ? "Edit food" : "Add food";
  $("fName").value = f ? f.name : "";
  $("fCal").value = f ? f.calories : "";
  $("fProt").value = f && f.protein !== null ? f.protein : "";
  $("formMsg").textContent = "";
  $("foodForm").classList.remove("hidden");
  $("foodForm").scrollIntoView({ behavior: "smooth", block: "start" });
  $("fName").focus();
}
function closeFoodForm() { $("foodForm").classList.add("hidden"); editingId = null; }

async function saveFood() {
  const msg = $("formMsg");
  msg.textContent = "";
  const name = $("fName").value.trim();
  const calories = parseFloat($("fCal").value);
  const protRaw = $("fProt").value.trim();
  const protein = protRaw === "" ? null : parseFloat(protRaw);
  if (!name) { msg.textContent = "Enter a name."; return; }
  if (!(calories >= 0)) { msg.textContent = "Enter calories (0 or more)."; return; }
  if (protein !== null && !(protein >= 0)) { msg.textContent = "Protein must be 0 or more (or leave blank for N/A)."; return; }
  const row = { name, calories, protein };
  const { error } = editingId
    ? await db.from("foods").update(row).eq("id", editingId)
    : await db.from("foods").insert(row);
  if (error) { msg.textContent = error.code === "23505" ? "You already have a food with that name." : "Error: " + error.message; return; }
  closeFoodForm();
  await loadFoods();
}

$("addFoodBtn").onclick = () => openFoodForm(null);
$("saveFoodBtn").onclick = saveFood;
$("cancelFoodBtn").onclick = closeFoodForm;
$("foodSearch").addEventListener("input", renderFoods);

/* ---------- dropdown ---------- */
function renderSuggest() {
  const q = $("foodInput").value.trim().toLowerCase();
  if (!q) { hideSuggest(); return; }
  const tokens = q.split(/\s+/);
  matches = foods
    .filter(f => tokens.every(t => f.name.toLowerCase().includes(t)))
    .sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || a.name.localeCompare(b.name))
    .slice(0, 8);
  activeIdx = 0;
  const ul = $("suggest");
  ul.innerHTML = "";
  if (!matches.length) { hideSuggest(); return; }
  matches.forEach((f, i) => {
    const li = document.createElement("li");
    if (i === 0) li.className = "active";
    const n = document.createElement("span"); n.textContent = f.name;
    const c = document.createElement("span"); c.className = "cal"; c.textContent = fmt(f.calories) + " cal";
    li.append(n, c);
    li.addEventListener("pointerdown", e => { e.preventDefault(); pickFood(f); });
    ul.appendChild(li);
  });
  ul.classList.remove("hidden");
}
function hideSuggest() { $("suggest").classList.add("hidden"); }
function pickFood(f) {
  selectedFood = f;
  $("foodInput").value = f.name;
  hideSuggest();
  $("logMsg2").textContent = "";
}
function moveActive(delta) {
  const items = $("suggest").children;
  if (!items.length) return;
  items[activeIdx].classList.remove("active");
  activeIdx = (activeIdx + delta + items.length) % items.length;
  items[activeIdx].classList.add("active");
  items[activeIdx].scrollIntoView({ block: "nearest" });
}

$("foodInput").addEventListener("input", () => { selectedFood = null; renderSuggest(); });
$("foodInput").addEventListener("blur", () => setTimeout(hideSuggest, 100));
$("foodInput").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (!$("suggest").classList.contains("hidden") && matches[activeIdx]) pickFood(matches[activeIdx]);
    else addEntry();
  } else if (e.key === "Escape") hideSuggest();
});

/* ---------- entries ---------- */
async function loadEntries() { await Promise.all([loadFoodEntries(), loadExercise()]); }

async function loadExercise() {
  const { data, error } = await db.from("exercise").select("id,name,calories_burned")
    .eq("entry_date", $("logDate").value).order("created_at");
  const body = $("exBody");
  body.innerHTML = "";
  if (error) { $("exMsg").textContent = "Error: " + error.message; return; }
  let total = 0;
  data.forEach(e => {
    total += e.calories_burned;
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = "🏃 " + e.name;
    const b = document.createElement("td"); b.className = "num"; b.textContent = "−" + fmt(e.calories_burned);
    const c = document.createElement("td"); c.className = "del";
    const btn = document.createElement("button"); btn.textContent = "×"; btn.setAttribute("aria-label", "Delete");
    btn.onclick = async () => {
      if (!confirm(`Delete "${e.name}"?`)) return;
      const { error } = await db.from("exercise").delete().eq("id", e.id);
      if (error) $("exMsg").textContent = "Error: " + error.message; else loadExercise();
    };
    c.appendChild(btn);
    tr.append(a, b, c);
    body.appendChild(tr);
  });
  if (data.length > 1) {
    const tr = document.createElement("tr"); tr.className = "total";
    const a = document.createElement("td"); a.textContent = "Total burned";
    const b = document.createElement("td"); b.className = "num"; b.textContent = "−" + fmt(total);
    tr.append(a, b, document.createElement("td"));
    body.appendChild(tr);
  }
}

async function addExercise() {
  const msg = $("exMsg");
  msg.textContent = "";
  const name = $("exLabel").value.trim();
  const cal = parseFloat($("exCal").value);
  if (!name) { msg.textContent = "Enter a label."; return; }
  if (!(cal > 0)) { msg.textContent = "Enter calories burned (above 0)."; return; }
  const { error } = await db.from("exercise").insert({ entry_date: $("logDate").value, name, calories_burned: cal });
  if (error) { msg.textContent = "Error: " + error.message; return; }
  $("exLabel").value = ""; $("exCal").value = "";
  loadExercise();
}
$("addExBtn").onclick = addExercise;

async function loadFoodEntries() {
  const date = $("logDate").value;
  const { data, error } = await db.from("entries")
    .select("id,food_name,quantity,calories_each")
    .eq("entry_date", date).order("created_at");
  const body = $("entryBody");
  body.innerHTML = "";
  if (error) { $("logMsg2").textContent = "Error: " + error.message; return; }
  $("emptyMsg").classList.toggle("hidden", data.length > 0);
  let total = 0;
  data.forEach(e => {
    const cals = e.quantity * e.calories_each;
    total += cals;
    const tr = document.createElement("tr");
    const tdName = document.createElement("td"); tdName.textContent = e.food_name;
    const tdQty = document.createElement("td"); tdQty.className = "num"; tdQty.textContent = fmt(e.quantity);
    const tdCal = document.createElement("td"); tdCal.className = "num"; tdCal.textContent = fmt(cals);
    const tdDel = document.createElement("td"); tdDel.className = "del";
    const btn = document.createElement("button"); btn.textContent = "×"; btn.setAttribute("aria-label", "Delete");
    btn.onclick = async () => {
      if (!confirm(`Delete "${e.food_name}"?`)) return;
      const { error } = await db.from("entries").delete().eq("id", e.id);
      if (error) $("logMsg2").textContent = "Error: " + error.message; else loadEntries();
    };
    tdDel.appendChild(btn);
    tr.append(tdName, tdQty, tdCal, tdDel);
    body.appendChild(tr);
  });
  if (data.length) {
    const tr = document.createElement("tr"); tr.className = "total";
    const a = document.createElement("td"); a.textContent = "Total"; a.colSpan = 2;
    const b = document.createElement("td"); b.className = "num"; b.textContent = fmt(total);
    const c = document.createElement("td");
    tr.append(a, b, c);
    body.appendChild(tr);
  }
}

async function addEntry() {
  const msg = $("logMsg2");
  msg.textContent = "";
  const typed = $("foodInput").value.trim().toLowerCase();
  const food = selectedFood || foods.find(f => f.name.toLowerCase() === typed);
  const qty = parseFloat($("qty").value);
  if (!food) { msg.textContent = "Pick a food from the list (add new foods on the Foods tab)."; return; }
  if (!(qty > 0)) { msg.textContent = "Enter a quantity above 0."; return; }
  const date = $("logDate").value;
  // If this food is already logged that day (same name and calories), add to its quantity instead of a new row
  const { data: existing, error: findErr } = await db.from("entries").select("id,quantity")
    .eq("entry_date", date).eq("food_name", food.name).eq("calories_each", food.calories)
    .order("created_at").limit(1);
  if (findErr) { msg.textContent = "Error: " + findErr.message; return; }
  let error;
  if (existing.length) {
    const newQty = Math.round((existing[0].quantity + qty) * 1000) / 1000;
    ({ error } = await db.from("entries").update({ quantity: newQty }).eq("id", existing[0].id));
  } else {
    ({ error } = await db.from("entries").insert({
      entry_date: date, food_name: food.name, quantity: qty, calories_each: food.calories, protein_each: food.protein
    }));
  }
  if (error) { msg.textContent = "Error: " + error.message; return; }
  selectedFood = null;
  $("foodInput").value = "";
  $("qty").value = 1;
  hideSuggest();
  await loadEntries();
  $("foodInput").focus();
}

/* ---------- date controls ---------- */
function setDate(str) { $("logDate").value = str; loadEntries(); }
$("logDate").addEventListener("change", () => { if ($("logDate").value) loadEntries(); });
$("prevDay").onclick = () => setDate(shiftDate($("logDate").value, -1));
$("nextDay").onclick = () => setDate(shiftDate($("logDate").value, 1));
$("todayBtn").onclick = () => setDate(todayStr());
$("addBtn").onclick = addEntry;

/* ---------- calendar ---------- */
const MIN_CAL = 1500, MAX_CAL = 3500;
// [calories, hue]: green 1500-2000, yellow 2000-2500, red 2500+
const HUE_STOPS = [[1500,135],[1950,100],[2000,58],[2500,48],[2560,12],[3500,0]];
function hueFor(c) {
  c = Math.min(Math.max(c, MIN_CAL), MAX_CAL);
  for (let i = 1; i < HUE_STOPS.length; i++) {
    const [c0, h0] = HUE_STOPS[i - 1], [c1, h1] = HUE_STOPS[i];
    if (c <= c1) return h0 + (h1 - h0) * (c - c0) / (c1 - c0);
  }
  return 0;
}
const colorFor = c => c >= MIN_CAL ? `hsl(${hueFor(c)}, 75%, 58%)` : null;
// Calendar color: net calories can dip below 1,500 after exercise; that still shows as the greenest shade
const calColor = c => colorFor(Math.max(c, MIN_CAL));
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad = n => String(n).padStart(2, "0");
const num = n => Math.round(n).toLocaleString();

let calView = "month", calData = {}, selDay = null;
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();

// Returns { "YYYY-MM-DD": { e: calories eaten, x: exercise burned } }
async function fetchYear(y) {
  const a = `${y}-01-01`, b = `${y}-12-31`;
  const [eRows, xRows] = await Promise.all([
    fetchAll("entries", "entry_date,quantity,calories_each", a, b),
    fetchAll("exercise", "entry_date,calories_burned", a, b)
  ]);
  const days = {};
  const day = d => days[d] || (days[d] = { e: 0, x: 0 });
  eRows.forEach(r => { day(r.entry_date).e += r.quantity * r.calories_each; });
  xRows.forEach(r => { day(r.entry_date).x += r.calories_burned; });
  return days;
}
async function ensureYear(y) {
  if (calData[y]) return;
  $("calTitle").textContent = "Loading…";
  try { calData[y] = await fetchYear(y); }
  catch (e) { calData[y] = {}; $("calNote").textContent = "Error: " + e.message; }
}
async function loadCalendar() {
  calData = {};
  await ensureYear(calYear);
  renderCalendar();
  if (selDay && calView === "month") loadDayDetail(selDay);
}

function renderScale() {
  const bar = $("scaleBar"), scale = $("scale");
  if (bar.dataset.done) return;
  bar.dataset.done = "1";
  const stops = [];
  for (let c = MAX_CAL; c >= MIN_CAL; c -= 50) stops.push(`${colorFor(c)} ${((MAX_CAL - c) / (MAX_CAL - MIN_CAL) * 100).toFixed(1)}%`);
  bar.style.background = `linear-gradient(to bottom, ${stops.join(",")})`;
  [3500, 3000, 2500, 2000, 1500].forEach(v => {
    const l = document.createElement("div");
    l.className = "slabel";
    l.textContent = num(v);
    l.style.top = `calc(8px + (100% - 16px) * ${(MAX_CAL - v) / (MAX_CAL - MIN_CAL)})`;
    scale.appendChild(l);
  });
}

function renderCalendar() {
  renderScale();
  $("viewYear").classList.toggle("on", calView === "year");
  $("viewMonth").classList.toggle("on", calView === "month");
  const main = $("calMain");
  main.innerHTML = "";
  const data = calData[calYear] || {};

  if (calView === "year") {
    $("calTitle").textContent = calYear;
    $("dayDetail").classList.add("hidden");
    $("calNote").textContent = "Each month is colored by its average net calories (eaten − exercise), counting only days with 1,500+ eaten.";
    const grid = document.createElement("div"); grid.className = "yeargrid";
    for (let m = 0; m < 12; m++) {
      let sum = 0, cnt = 0;
      Object.entries(data).forEach(([d, t]) => {
        if (+d.slice(5, 7) === m + 1 && t.e >= MIN_CAL) { sum += t.e - t.x; cnt++; }
      });
      const avg = cnt ? sum / cnt : null;
      const tile = document.createElement("div");
      tile.className = "mtile" + (avg === null ? " uncolored" : "");
      if (avg !== null) tile.style.background = calColor(avg);
      tile.innerHTML = `<div class="mn">${MONTHS[m].slice(0, 3)}</div><div class="av">${avg === null ? "—" : num(avg)}</div><div class="dc">${cnt ? cnt + " days" : "no data"}</div>`;
      tile.onclick = () => { calMonth = m; calView = "month"; selDay = null; renderCalendar(); };
      grid.appendChild(tile);
    }
    main.appendChild(grid);
    return;
  }

  $("calTitle").textContent = `${MONTHS[calMonth]} ${calYear}`;
  $("calNote").textContent = "Colors use net calories (eaten − exercise). Days with under 1,500 eaten are treated as not fully logged and left uncolored (the gray number is what was eaten).";
  const grid = document.createElement("div"); grid.className = "monthgrid";
  "SMTWTFS".split("").forEach(d => { const h = document.createElement("div"); h.className = "dow"; h.textContent = d; grid.appendChild(h); });
  const startDow = new Date(calYear, calMonth, 1).getDay();
  const dim = new Date(calYear, calMonth + 1, 0).getDate();
  for (let i = 0; i < startDow; i++) { const b = document.createElement("div"); b.className = "day blank"; grid.appendChild(b); }
  const today = todayStr();
  for (let d = 1; d <= dim; d++) {
    const key = `${calYear}-${pad(calMonth + 1)}-${pad(d)}`;
    const t = data[key];
    // Colored only if 1,500+ was eaten; the color and number shown are net (eaten − exercise)
    const col = t && t.e >= MIN_CAL ? calColor(t.e - t.x) : null;
    const total = col ? t.e - t.x : (t && t.e > 0 ? t.e : undefined);
    const cell = document.createElement("div");
    cell.className = "day" + (col ? "" : " uncolored") + (key === today ? " today" : "") + (key === selDay ? " sel" : "");
    if (col) cell.style.background = col;
    cell.innerHTML = `<div class="n">${d}</div><div class="c">${total !== undefined ? num(total) : ""}</div>`;
    cell.onclick = () => { selDay = key; renderCalendar(); loadDayDetail(key); };
    grid.appendChild(cell);
  }
  main.appendChild(grid);
  if (!selDay) $("dayDetail").classList.add("hidden");
}

async function loadDayDetail(dateStr) {
  const box = $("dayDetail");
  box.classList.remove("hidden");
  box.textContent = "Loading…";
  const [f, x] = await Promise.all([
    db.from("entries").select("food_name,quantity,calories_each").eq("entry_date", dateStr).order("created_at"),
    db.from("exercise").select("name,calories_burned").eq("entry_date", dateStr).order("created_at")
  ]);
  if (f.error) { box.textContent = "Error: " + f.error.message; return; }
  const foodsDay = f.data, exDay = x.data || [];
  const eaten = foodsDay.reduce((s, e) => s + e.quantity * e.calories_each, 0);
  const burned = exDay.reduce((s, e) => s + e.calories_burned, 0);
  const pretty = new Date(dateStr + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  box.innerHTML = "";
  const h = document.createElement("h3"); h.textContent = pretty; box.appendChild(h);
  const sub = document.createElement("p"); sub.className = "muted"; sub.style.margin = "0 0 6px";
  sub.textContent = `${num(eaten)} eaten` + (exDay.length ? ` − ${num(burned)} exercise = ${num(eaten - burned)} net` : "");
  box.appendChild(sub);
  if (!foodsDay.length && !exDay.length) { const p = document.createElement("p"); p.className = "muted"; p.textContent = "Nothing logged this day."; box.appendChild(p); return; }
  const t = document.createElement("table");
  t.innerHTML = "<thead><tr><th>Item</th><th class='num'>Qty</th><th class='num'>Cal</th></tr></thead>";
  const tb = document.createElement("tbody");
  const addRow = (name, q, c) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = name;
    const b = document.createElement("td"); b.className = "num"; b.textContent = q;
    const d = document.createElement("td"); d.className = "num"; d.textContent = c;
    tr.append(a, b, d); tb.appendChild(tr);
  };
  foodsDay.forEach(e => addRow(e.food_name, fmt(e.quantity), fmt(e.quantity * e.calories_each)));
  exDay.forEach(e => addRow("🏃 " + e.name, "", "−" + fmt(e.calories_burned)));
  t.appendChild(tb); box.appendChild(t);
}

async function calStep(dir) {
  if (calView === "year") calYear += dir;
  else { calMonth += dir; if (calMonth > 11) { calMonth = 0; calYear++; } if (calMonth < 0) { calMonth = 11; calYear--; } }
  selDay = null;
  await ensureYear(calYear);
  renderCalendar();
}
$("calPrev").onclick = () => calStep(-1);
$("calNext").onclick = () => calStep(1);
$("viewYear").onclick = () => { calView = "year"; renderCalendar(); };
$("viewMonth").onclick = () => { calView = "month"; renderCalendar(); };

/* ---------- stats / weight estimate ---------- */
const BASELINE = 2500;    // calories burned per day doing nothing
const CAL_PER_LB = 3500;  // calories per pound of body weight
let weighIns = [], statSeries = [], rangeCustom = false;

async function fetchAll(table, cols, fromD, toD) {
  const out = [];
  let from = 0;
  while (true) {
    const { data, error } = await db.from(table).select(cols)
      .gte("entry_date", fromD).lte("entry_date", toD).order("id").range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
const prettyDate = s => new Date(s + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

async function loadStats() {
  const note = $("statNote");
  const today = todayStr();
  $("wMsg").textContent = "";
  if (!$("wDate").value) $("wDate").value = today;
  $("wDate").max = today;
  const { data, error } = await db.from("weights").select("id,weigh_date,weight").order("weigh_date");
  if (error) { note.textContent = "Error: " + error.message + " (Did you run 4-weights.sql in Supabase?)"; return; }
  weighIns = data;
  renderWeighList();
  if (!weighIns.length) {
    statSeries = []; $("chartBox").innerHTML = ""; $("readout").textContent = "";
    note.textContent = "Enter a starting weight and date above to start the graph.";
    return;
  }
  const start = weighIns[0].weigh_date;
  try {
    const [eRows, xRows] = await Promise.all([
      fetchAll("entries", "entry_date,quantity,calories_each", start, today),
      fetchAll("exercise", "entry_date,calories_burned", start, today)
    ]);
    const eaten = {}, burned = {};
    eRows.forEach(r => { eaten[r.entry_date] = (eaten[r.entry_date] || 0) + r.quantity * r.calories_each; });
    xRows.forEach(r => { burned[r.entry_date] = (burned[r.entry_date] || 0) + r.calories_burned; });
    // One continuous line from the first weigh-in. A day changes the estimate only if 1,500+ calories were logged.
    // Today is not counted until it is over, so today's point reflects everything through yesterday.
    let w = Number(weighIns[0].weight), d = start;
    statSeries = [{ d, w }];
    while (d < today) {
      if ((eaten[d] || 0) >= MIN_CAL) w -= (BASELINE + (burned[d] || 0) - eaten[d]) / CAL_PER_LB;
      d = shiftDate(d, 1);
      statSeries.push({ d, w });
    }
  } catch (e) { note.textContent = "Error: " + e.message; return; }
  if (!rangeCustom) { $("rFrom").value = start; $("rTo").value = today; }
  drawChart();
}

function renderWeighList() {
  const b = $("wBody");
  b.innerHTML = "";
  weighIns.slice().reverse().forEach(x => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = prettyDate(x.weigh_date) + (x === weighIns[0] ? "  (start)" : "");
    const w = document.createElement("td"); w.className = "num"; w.textContent = fmt(x.weight) + " lb";
    const c = document.createElement("td"); c.className = "del";
    const btn = document.createElement("button"); btn.textContent = "×"; btn.setAttribute("aria-label", "Delete");
    btn.onclick = async () => {
      if (!confirm(`Delete the ${prettyDate(x.weigh_date)} weigh-in?` + (x === weighIns[0] ? "\nThe graph will start from your next weigh-in." : ""))) return;
      const { error } = await db.from("weights").delete().eq("id", x.id);
      if (error) $("wMsg").textContent = "Error: " + error.message; else loadStats();
    };
    c.appendChild(btn);
    tr.append(a, w, c);
    b.appendChild(tr);
  });
}

async function saveWeight() {
  const msg = $("wMsg");
  msg.textContent = "";
  const date = $("wDate").value, w = parseFloat($("wVal").value);
  if (!date) { msg.textContent = "Pick a date."; return; }
  if (!(w > 0)) { msg.textContent = "Enter your weight in pounds."; return; }
  const { data: ex, error: e1 } = await db.from("weights").select("id").eq("weigh_date", date).limit(1);
  if (e1) { msg.textContent = "Error: " + e1.message + " (Did you run 4-weights.sql?)"; return; }
  const { error } = ex.length
    ? await db.from("weights").update({ weight: w }).eq("id", ex[0].id)
    : await db.from("weights").insert({ weigh_date: date, weight: w });
  if (error) { msg.textContent = "Error: " + error.message; return; }
  $("wVal").value = "";
  await loadStats();
}

function drawChart() {
  const box = $("chartBox"), note = $("statNote");
  $("readout").textContent = "";
  if (!statSeries.length) return;
  const from = $("rFrom").value || statSeries[0].d, to = $("rTo").value || todayStr();
  const pts = statSeries.filter(p => p.d >= from && p.d <= to);
  const dots = weighIns.filter(x => x.weigh_date >= from && x.weigh_date <= to);
  if (!pts.length) { box.innerHTML = ""; note.textContent = "No data in this range."; return; }

  const W = 640, H = 300, L = 46, R = 14, T = 14, B = 30;
  const dayNum = s => Math.round(new Date(s + "T12:00:00").getTime() / 864e5);
  const d0 = dayNum(pts[0].d), span = Math.max(1, dayNum(pts[pts.length - 1].d) - d0);
  const single = pts.length === 1;
  const vals = pts.map(p => p.w).concat(dots.map(x => Number(x.weight)));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
  const step = [0.5, 1, 2, 5, 10, 20, 50].find(s => s >= (hi - lo) / 4) || 50;
  const yMin = Math.floor(lo / step) * step, yMax = Math.ceil(hi / step) * step;
  const X = ds => single ? (L + W - R) / 2 : L + (dayNum(ds) - d0) / span * (W - L - R);
  const Y = v => T + (yMax - v) / (yMax - yMin) * (H - T - B);
  const lab = ds => new Date(ds + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: span > 330 ? "2-digit" : undefined });

  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">`;
  for (let v = yMin; v <= yMax + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/>`;
    s += `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${fmt(v)}</text>`;
  }
  const n = single ? 1 : Math.min(5, span + 1);
  for (let i = 0; i < n; i++) {
    const ds = single ? pts[0].d : shiftDate(pts[0].d, Math.round(span * i / (n - 1)));
    const anchor = n === 1 ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    s += `<text x="${X(ds)}" y="${H - 8}" text-anchor="${anchor}" font-size="11" style="fill:var(--muted)">${lab(ds)}</text>`;
  }
  if (!single) s += `<path d="${pts.map((p, i) => (i ? "L" : "M") + X(p.d).toFixed(1) + " " + Y(p.w).toFixed(1)).join(" ")}" fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var(--accent)"/>`;
  else s += `<circle cx="${X(pts[0].d)}" cy="${Y(pts[0].w)}" r="3" style="fill:var(--accent)"/>`;
  s += `<line id="guide" y1="${T}" y2="${H - B}" style="stroke:var(--muted);stroke-dasharray:3 3;display:none"/><circle id="gdot" r="4" style="fill:var(--accent);display:none"/>`;
  dots.forEach(x => { s += `<circle cx="${X(x.weigh_date)}" cy="${Y(Number(x.weight))}" r="5.5" stroke-width="2" style="fill:var(--dot);stroke:var(--bg)"/>`; });
  s += "</svg>";
  box.innerHTML = s;

  const svgEl = box.querySelector("svg");
  const move = ev => {
    const r = svgEl.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let best = pts[0], bd = Infinity;
    pts.forEach(p => { const dd = Math.abs(X(p.d) - px); if (dd < bd) { bd = dd; best = p; } });
    const g = svgEl.querySelector("#guide"), gd = svgEl.querySelector("#gdot");
    g.setAttribute("x1", X(best.d)); g.setAttribute("x2", X(best.d)); g.style.display = "";
    gd.setAttribute("cx", X(best.d)); gd.setAttribute("cy", Y(best.w)); gd.style.display = "";
    const wi = weighIns.find(x => x.weigh_date === best.d);
    $("readout").textContent = `${prettyDate(best.d)} · estimate ${best.w.toFixed(1)} lb` + (wi ? ` · weighed ${fmt(wi.weight)} lb` : "");
  };
  svgEl.addEventListener("pointermove", move);
  svgEl.addEventListener("pointerdown", move);

  const first = statSeries[0], last = statSeries[statSeries.length - 1], diff = last.w - first.w;
  note.textContent = `Current estimate: ${last.w.toFixed(1)} lb (${diff <= 0 ? "−" : "+"}${Math.abs(diff).toFixed(1)} lb since ${prettyDate(first.d)}). ` +
    `Days with under ${num(MIN_CAL)} calories logged hold weight flat, and today counts once it's over.`;
}

$("wAddBtn").onclick = saveWeight;
["rFrom", "rTo"].forEach(id => $(id).addEventListener("change", () => { rangeCustom = true; drawChart(); }));
document.querySelectorAll("#quick button").forEach(b => b.onclick = () => {
  if (!statSeries.length) return;
  const today = todayStr();
  if (b.dataset.r === "all") { rangeCustom = false; $("rFrom").value = statSeries[0].d; }
  else { rangeCustom = true; $("rFrom").value = shiftDate(today, -(Number(b.dataset.r) - 1)); }
  $("rTo").value = today;
  drawChart();
});

/* ---------- auth ---------- */
async function render(session) {
  $("login").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  if (session) {
    if (!$("logDate").value) $("logDate").value = todayStr();
    await loadFoods();
    loadEntries();
  }
}
$("loginBtn").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  $("loginMsg").textContent = error ? error.message : "";
};
$("logoutBtn").onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_e, session) => { if (_e === "SIGNED_IN" || _e === "SIGNED_OUT") render(session); });
db.auth.getSession().then(({ data }) => render(data.session));
